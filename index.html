<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дія.Девайси</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    
    <style>
        /* M3 Expressive Dynamic Color Palette */
        :root {
            --md-sys-color-background: #f3f0f8;
            --md-sys-color-surface: #fef7ff;
            --md-sys-color-surface-variant: #e7e0ec;
            --md-sys-color-primary: #6750a4;
            --md-sys-color-on-primary: #ffffff;
            --md-sys-color-primary-container: #eaddff;
            --md-sys-color-on-primary-container: #21005d;
            --md-sys-color-on-surface: #1d1b20;
            --md-sys-color-on-surface-variant: #49454f;
            --md-sys-color-outline: #79747e;
            --md-sys-color-outline-variant: #c7c4cd;
            --md-sys-color-error: #b3261e;
            --md-shape-corner-extra-large: 28px;
            --md-shape-corner-full: 9999px;
            --md-elevation-2: 0px 1px 2px rgba(0, 0, 0, 0.3), 0px 2px 6px 2px rgba(0, 0, 0, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(180deg, #e3dcff 0%, var(--md-sys-color-background) 100%);
            color: var(--md-sys-color-on-surface);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            padding-bottom: 80px; /* Отступ под нижний бар */
        }

        /* Контейнеры экранов */
        .screen {
            display: none;
            width: 100%;
            height: calc(100vh - 80px);
            animation: fadeIn 0.25s ease;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- ГЛАВНЫЙ ЭКРАН (КАРУСЕЛЬ) --- */
        .swiper-container {
            width: 100%;
            max-width: 450px;
            height: 70vh;
            display: flex;
            align-items: center;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            scrollbar-width: none;
            padding: 0 40px;
        }

        .swiper-container::-webkit-scrollbar { display: none; }

        .device-card {
            min-width: calc(100% - 20px);
            max-width: calc(100% - 20px);
            height: 520px;
            background: var(--md-sys-color-surface);
            border-radius: var(--md-shape-corner-extra-large);
            margin: 0 10px;
            scroll-snap-align: center;
            box-shadow: var(--md-elevation-2);
            border: 1px solid rgba(255, 255, 255, 0.7);
            display: flex;
            flex-direction: column;
            padding: 24px;
            position: relative;
        }

        .card-header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .card-header {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .card-body {
            display: grid;
            grid-template-columns: 130px 1fr;
            gap: 20px;
            flex-grow: 1;
        }

        .device-photo-wrapper {
            width: 130px;
            height: 170px;
            background-color: var(--md-sys-color-surface-variant);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--md-sys-color-outline);
        }

        .device-photo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .device-photo-placeholder {
            font-size: 40px;
            color: var(--md-sys-color-on-surface-variant);
        }

        .device-info {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .info-block { display: flex; flex-direction: column; }
        .info-label {
            font-size: 11px;
            color: var(--md-sys-color-on-surface-variant);
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .info-value {
            font-size: 16px;
            font-weight: 500;
            word-break: break-all;
        }

        .card-footer-status {
            background-color: #cce7d2;
            color: #00531b;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: auto;
        }

        .page-indicator {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            height: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--md-sys-color-outline);
            opacity: 0.4;
            border-radius: var(--md-shape-corner-full);
            transition: all 0.3s ease;
        }

        .dot.active {
            opacity: 1;
            width: 18px;
            background-color: var(--md-sys-color-primary);
        }

        /* --- ЭКРАН НАСТРОЕК --- */
        .settings-container {
            width: 100%;
            max-width: 450px;
            height: 100%;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .settings-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            padding-left: 4px;
        }

        .settings-card {
            background: var(--md-sys-color-surface);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0px 1px 3px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.5);
        }

        .settings-card h4 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--md-sys-color-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Пункт "Про застосунок" */
        .app-info-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .app-info-item {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            border-bottom: 1px solid var(--md-sys-color-surface-variant);
            padding-bottom: 8px;
        }
        .app-info-item:last-child { border: none; padding: 0; }
        .app-info-item .value { font-weight: 500; color: var(--md-sys-color-on-surface-variant); }

        /* Пункт "Положення карток" */
        .position-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .position-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--md-sys-color-surface-variant);
            padding: 12px 16px;
            border-radius: 12px;
        }
        .position-item-title {
            font-weight: 500;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }
        .position-actions {
            display: flex;
            gap: 2px;
        }
        .btn-action {
            background: none;
            border: none;
            color: var(--md-sys-color-on-surface-variant);
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: var(--md-shape-corner-full);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-action:hover { background-color: rgba(0,0,0,0.05); }
        .btn-action.delete:hover { color: var(--md-sys-color-error); }

        /* --- НИЖНЯЯ ПАНЕЛЬ НАВИГАЦИИ (M3) --- */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background-color: #f7f2fa;
            box-shadow: 0px -1px 3px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 90;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 12px;
            font-weight: 500;
            width: 100%;
            height: 100%;
            justify-content: center;
        }

        .nav-icon-wrapper {
            width: 64px;
            height: 32px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease;
        }

        .nav-item.active .nav-icon-wrapper {
            background-color: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
        }

        .nav-item.active {
            color: var(--md-sys-color-on-surface);
            font-weight: 700;
        }

        /* FLOATING ACTION BUTTON (+) */
        .fab-add {
            position: fixed;
            bottom: 100px; /* Поднят выше, чтобы не перекрывать навибар */
            right: 24px;
            width: 56px;
            height: 56px;
            background-color: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--md-elevation-2);
            transition: all 0.2s ease;
            z-index: 80;
        }

        .fab-add:hover { transform: scale(1.05); }

        /* МОДАЛЬНОЕ ОКНО */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-content {
            width: 100%;
            max-width: 500px;
            background-color: var(--md-sys-color-surface);
            border-top-left-radius: var(--md-shape-corner-extra-large);
            border-top-right-radius: var(--md-shape-corner-extra-large);
            padding: 32px 24px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1);
        }

        .modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-title { font-size: 24px; font-weight: 700; margin-bottom: 24px; }
        .input-group { position: relative; margin-bottom: 16px; }
        .input-field {
            width: 100%;
            padding: 16px;
            background-color: var(--md-sys-color-surface-variant);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            color: var(--md-sys-color-on-surface);
            outline: none;
        }
        .file-input-label {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background-color: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
            margin-bottom: 16px;
            justify-content: center;
        }
        .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
        .btn { padding: 12px 24px; border-radius: var(--md-shape-corner-full); font-size: 14px; font-weight: 500; border: none; cursor: pointer; }
        .btn-text { background: none; color: var(--md-sys-color-primary); }
        .btn-filled { background-color: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
        .empty-state { text-align: center; color: var(--md-sys-color-on-surface-variant); padding: 40px; width: 100%; }
    </style>
</head>
<body>

    <div id="screenHome" class="screen active">
        <div class="swiper-container" id="swiperContainer"></div>
        <div class="page-indicator" id="pageIndicator"></div>
    </div>

    <div id="screenSettings" class="screen">
        <div class="settings-container">
            <h2 class="settings-title">Налаштування</h2>
            
            <div class="settings-card">
                <h4><span class="material-symbols-rounded">info</span> Про застосунок</h4>
                <div class="app-info-list">
                    <div class="app-info-item">
                        <span>Назва</span>
                        <span class="value">Дія.Девайси</span>
                    </div>
                    <div class="app-info-item">
                        <span>Версія</span>
                        <span class="value">3.4.12-expressive</span>
                    </div>
                    <div class="app-info-item">
                        <span>Збірка</span>
                        <span class="value">2026.06.14</span>
                    </div>
                    <div class="app-info-item">
                        <span>Шифрування даних</span>
                        <span class="value" style="color: #00531b;">Увімкнено (AES-256)</span>
                    </div>
                </div>
            </div>

            <div class="settings-card">
                <h4><span class="material-symbols-rounded">low_priority</span> Положення карток</h4>
                <div class="position-list" id="positionList">
                    </div>
            </div>
        </div>
    </div>

    <button class="fab-add" id="openModalBtn" aria-label="Додати пристрій">
        <span class="material-symbols-rounded">add</span>
    </button>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="switchScreen('home', this)">
            <div class="nav-icon-wrapper">
                <span class="material-symbols-rounded">style</span>
            </div>
            <span>Головна</span>
        </div>
        <div class="nav-item" onclick="switchScreen('settings', this)">
            <div class="nav-icon-wrapper">
                <span class="material-symbols-rounded">settings</span>
            </div>
            <span>Налаштування</span>
        </div>
    </nav>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h3 class="modal-title">Додати пристрій</h3>
            <form id="deviceForm">
                <label class="file-input-label">
                    <span class="material-symbols-rounded">upload_file</span>
                    <span id="fileLabelText">Завантажити фото пристрою</span>
                    <input type="file" id="devicePhoto" accept="image/*" style="display: none;" required>
                </label>
                <div class="input-group">
                    <input type="text" id="deviceName" class="input-field" placeholder="Назва пристрою" required>
                </div>
                <div class="input-group">
                    <input type="text" id="deviceSerial" class="input-field" placeholder="Серійний номер" required>
                </div>
                <div class="input-group">
                    <input type="text" id="deviceWarranty" class="input-field" placeholder="Термін гарантії" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-text" id="closeModalBtn">Скасувати</button>
                    <button type="submit" class="btn btn-filled">Додати</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Загрузка данных
        let devices = JSON.parse(localStorage.getItem('dia_devices')) || [
            { name: "MacBook Pro M3", serial: "C02FX54QMD6M", warranty: "до 24.11.2026", photo: "" }
        ];

        const swiperContainer = document.getElementById('swiperContainer');
        const pageIndicator = document.getElementById('pageIndicator');
        const positionList = document.getElementById('positionList');
        const modalOverlay = document.getElementById('modalOverlay');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const deviceForm = document.getElementById('deviceForm');
        const devicePhotoInput = document.getElementById('devicePhoto');
        const fileLabelText = document.getElementById('fileLabelText');

        function saveToLocalStorage() {
            localStorage.setItem('dia_devices', JSON.stringify(devices));
        }

        // Переключение экранов
        function switchScreen(screenName, element) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            
            element.classList.add('active');

            if (screenName === 'home') {
                document.getElementById('screenHome').classList.add('active');
                openModalBtn.style.display = 'flex';
                renderHomeDevices();
            } else if (screenName === 'settings') {
                document.getElementById('screenSettings').classList.add('active');
                openModalBtn.style.display = 'none';
                renderSettingsManager();
            }
        }

        // Рендеринг главного экрана
        function renderHomeDevices(targetIndex = null) {
            swiperContainer.innerHTML = '';
            pageIndicator.innerHTML = '';

            if (devices.length === 0) {
                swiperContainer.innerHTML = `
                    <div class="empty-state">
                        <span class="material-symbols-rounded" style="font-size: 48px; margin-bottom:12px;">no_devices</span>
                        <h3>Немає доданих пристроїв</h3>
                    </div>`;
                return;
            }

            devices.forEach((device, index) => {
                const card = document.createElement('div');
                card.className = 'device-card';
                const photoHtml = device.photo 
                    ? `<img src="${device.photo}" alt="${device.name}">`
                    : `<span class="material-symbols-rounded device-photo-placeholder">devices</span>`;

                card.innerHTML = `
                    <div class="card-header-container">
                        <div class="card-header">Паспорт пристрою</div>
                    </div>
                    <div class="card-body">
                        <div class="device-photo-wrapper">${photoHtml}</div>
                        <div class="device-info">
                            <div class="info-block"><span class="info-label">Назва</span><span class="value info-value">${device.name}</span></div>
                            <div class="info-block"><span class="info-label">Серійний номер</span><span class="value info-value">${device.serial}</span></div>
                            <div class="info-block"><span class="info-label">Гарантія</span><span class="value info-value">${device.warranty}</span></div>
                        </div>
                    </div>
                    <div class="card-footer-status">
                        <span class="material-symbols-rounded" style="font-size: 18px;">check_circle</span>
                        Документ оновлено • Цифровий запис дійсний
                    </div>
                `;
                swiperContainer.appendChild(card);

                const dot = document.createElement('div');
                dot.className = `dot ${index === 0 ? 'active' : ''}`;
                pageIndicator.appendChild(dot);
            });

            updateActiveDot();
            if (targetIndex !== null && devices[targetIndex]) {
                setTimeout(() => {
                    const cards = document.querySelectorAll('.device-card');
                    swiperContainer.scrollLeft = cards[targetIndex].offsetLeft - 40;
                }, 50);
            }
        }

        // Рендеринг менеджера положения в Настройках
        function renderSettingsManager() {
            positionList.innerHTML = '';

            if (devices.length === 0) {
                positionList.innerHTML = `<p style="font-size: 14px; opacity: 0.6; text-align: center; padding: 12px;">Список пристроїв порожній</p>`;
                return;
            }

            devices.forEach((device, index) => {
                const item = document.createElement('div');
                item.className = 'position-item';

                const upBtn = index > 0 
                    ? `<button class="btn-action" onclick="moveDevice(${index}, -1)"><span class="material-symbols-rounded">arrow_upward</span></button>` : '';
                const downBtn = index < devices.length - 1 
                    ? `<button class="btn-action" onclick="moveDevice(${index}, 1)"><span class="material-symbols-rounded">arrow_downward</span></button>` : '';

                item.innerHTML = `
                    <span class="position-item-title">${device.name}</span>
                    <div class="position-actions">
                        ${upBtn}
                        ${downBtn}
                        <button class="btn-action delete" onclick="deleteDevice(${index})"><span class="material-symbols-rounded">delete</span></button>
                    </div>
                `;
                positionList.appendChild(item);
            });
        }

        // Перемещение устройств
        window.moveDevice = function(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= devices.length) return;

            const temp = devices[index];
            devices[index] = devices[newIndex];
            devices[newIndex] = temp;

            saveToLocalStorage();
            renderSettingsManager();
        };

        // Удаление устройств
        window.deleteDevice = function(index) {
            if (confirm(`Ви впевнені, що хочете видалити ${devices[index].name}?`)) {
                devices.splice(index, 1);
                saveToLocalStorage();
                renderSettingsManager();
            }
        };

        // Обновление точек
        function updateActiveDot() {
            const dots = document.querySelectorAll('.dot');
            if(dots.length === 0) return;
            const activeIndex = Math.round(swiperContainer.scrollLeft / swiperContainer.offsetWidth);
            dots.forEach((dot, idx) => {
                dot.classList.toggle('active', idx === activeIndex);
            });
        }
        swiperContainer.addEventListener('scroll', updateActiveDot);

        // Модалка
        openModalBtn.addEventListener('click', () => modalOverlay.classList.add('active'));
        closeModalBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
            deviceForm.reset();
            fileLabelText.innerText = "Завантажити фото пристрою";
        });
        devicePhotoInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) fileLabelText.innerText = e.target.files[0].name;
        });

        // Создание девайса
        deviceForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const file = devicePhotoInput.files[0];
            const reader = new FileReader();

            reader.onloadend = function () {
                const newDevice = {
                    name: document.getElementById('deviceName').value,
                    serial: document.getElementById('deviceSerial').value,
                    warranty: document.getElementById('deviceWarranty').value,
                    photo: reader.result
                };
                devices.push(newDevice);
                saveToLocalStorage();
                renderHomeDevices(devices.length - 1);
                modalOverlay.classList.remove('active');
                deviceForm.reset();
                fileLabelText.innerText = "Завантажити фото пристрою";
            }
            if (file) reader.readAsDataURL(file);
            else reader.onloadend();
        });

        // Старт
        renderHomeDevices();
    </script>
</body>
</html>
